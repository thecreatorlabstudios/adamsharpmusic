<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Adam Sharp: Fireworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root { --sky: #05060c; --ink: #f3ecdf; --dim: #d0cce0; --ember: #ff8a3d; --gold: #ffd27d; --line: rgba(255, 226, 170, 0.2); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 16px/1.6 "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px 16px; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(60% 50% at 50% 38%, rgba(255, 138, 61, 0.16), rgba(5, 6, 12, 0) 70%),
    radial-gradient(1.2px 1.2px at 12% 22%, #fff8 50%, transparent 52%), radial-gradient(1px 1px at 78% 14%, #ffd27dbb 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 34% 78%, #fff9 50%, transparent 52%), radial-gradient(1px 1px at 88% 66%, #fff7 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 58% 90%, #ffd27d99 50%, transparent 52%), radial-gradient(1px 1px at 6% 62%, #fff7 50%, transparent 52%),
    radial-gradient(1px 1px at 66% 36%, #fff6 50%, transparent 52%), radial-gradient(1.2px 1.2px at 22% 48%, #ffd27d88 50%, transparent 52%); }
main { width: min(400px, 100%); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.mono { font: 500 0.72rem/1.4 "DM Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; }
.dim { color: var(--dim); }
h1 { font: italic 400 clamp(4rem, 17vw, 6.4rem)/0.9 "Instrument Serif", "Iowan Old Style", Georgia, serif; margin: 0; padding-right: 0.08em; background: linear-gradient(180deg, #fff4d6 8%, var(--gold) 45%, var(--ember) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 26px rgba(255, 138, 61, 0.35)); }
.lede { margin: 0 0 6px; color: #ddd5c6; max-width: 32ch; text-wrap: balance; }
form { width: 100%; display: grid; gap: 12px; text-align: left; margin-top: 4px; padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: rgba(9, 10, 20, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
label { display: grid; gap: 6px; }
label span { color: var(--dim); }
input { font: inherit; color: var(--ink); background: rgba(5, 6, 12, 0.85); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; width: 100%; }
input:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
button { font: 600 0.95rem/1 "Manrope", system-ui, sans-serif; padding: 14px 20px; border-radius: 999px; border: 0; background: var(--gold); color: #1b1206; cursor: pointer; box-shadow: 0 0 30px rgba(255, 210, 125, 0.25); margin-top: 4px; transition: transform .18s, box-shadow .18s; }
button:hover { transform: translateY(-1px); box-shadow: 0 0 42px rgba(255, 210, 125, 0.45); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.err { margin: 0; padding: 10px 12px; border: 1px solid rgba(255, 120, 100, 0.5); border-radius: 6px; background: rgba(255, 90, 70, 0.08); color: #ffb4a6; font-size: 0.9rem; }
footer { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <p class="mono dim">Adam Sharp presents</p>
  <h1>Fireworks</h1>
  <p class="lede">This is a private preview. Sign in to step inside.</p>
  <form method="post" action="/api/login" autocomplete="on">
    <p class="err" id="err" role="alert" hidden></p>
    <input type="hidden" name="next" id="next" value="/">
    <label><span class="mono">Username</span><input name="username" id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label><span class="mono">Password</span><input name="password" id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <footer class="mono dim">Site by CreatorLab Studios</footer>
</main>
<script src="/login.js"></script>
</body>
</html>
