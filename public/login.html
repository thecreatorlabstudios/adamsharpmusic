<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090816">
<link rel="icon" type="image/svg+xml" href="/brand/monogram.svg">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Adam Sharp: Fireworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Adam Sharp Brand Guide: Midnight ground, Indigo card, Bone text, Spark Gold for the one focal thing, Glow for small text. Cinzel, Cormorant Garamond, Jost. */
:root { --sky: #090816; --indigo: #14152C; --ink: #EEF0EE; --dim: #B2C7F6; --gold: #F2B057; --uv: #5468FF; --line: rgba(178, 199, 246, 0.28); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 17px/1.6 "Jost", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding: 24px 16px; -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(60% 50% at 50% 34%, rgba(84, 104, 255, 0.16), rgba(9, 8, 22, 0) 70%),
    radial-gradient(1.2px 1.2px at 12% 22%, #EEF0EE88 50%, transparent 52%), radial-gradient(1px 1px at 78% 14%, #F2B057bb 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 34% 78%, #EEF0EE99 50%, transparent 52%), radial-gradient(1px 1px at 88% 66%, #B2C7F677 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 58% 90%, #F2B05799 50%, transparent 52%), radial-gradient(1px 1px at 6% 62%, #B2C7F677 50%, transparent 52%); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-conic-gradient(from 0deg at 50% 26%, rgba(242, 176, 87, 0.09) 0deg 1.1deg, transparent 1.1deg 7.5deg); -webkit-mask: radial-gradient(60% 50% at 50% 26%, #000 0%, transparent 72%); mask: radial-gradient(60% 50% at 50% 26%, #000 0%, transparent 72%); }
main { position: relative; width: min(400px, 100%); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.label { font: 500 0.75rem/1.4 "Jost", sans-serif; letter-spacing: 0.26em; text-transform: uppercase; margin: 0; color: var(--dim); }
.logo { width: min(300px, 78vw); height: auto; }
h1 { font: 700 clamp(1.8rem, 9vw, 2.6rem)/1.1 "Cinzel", "Times New Roman", serif; letter-spacing: 0.14em; text-transform: uppercase; margin: 6px 0 0; padding-left: 0.14em; color: var(--gold); text-shadow: 0 0 30px rgba(242, 176, 87, 0.3); }
.lede { margin: 0 0 6px; color: var(--ink); max-width: 32ch; text-wrap: balance; }
form { width: 100%; display: grid; gap: 12px; text-align: left; margin-top: 4px; padding: 22px; border: 1px solid var(--line); border-radius: 10px; background: rgba(20, 21, 44, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
label { display: grid; gap: 6px; }
label span { color: var(--dim); }
input { font: inherit; color: var(--ink); background: var(--sky); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; width: 100%; }
input:focus { outline: 2px solid var(--dim); outline-offset: 1px; border-color: transparent; }
button { font: 600 0.8rem/1 "Jost", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; padding: 15px 20px; border-radius: 999px; border: 0; background: var(--gold); color: var(--sky); cursor: pointer; margin-top: 4px; transition: transform .18s, box-shadow .18s; box-shadow: 0 0 30px rgba(242, 176, 87, 0.22); }
button:hover { transform: translateY(-1px); box-shadow: 0 0 42px rgba(242, 176, 87, 0.4); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.err { margin: 0; padding: 10px 12px; border: 1px solid rgba(229, 82, 74, 0.6); border-radius: 6px; background: rgba(229, 82, 74, 0.1); color: #FFD0CB; font-size: 0.95rem; }
footer { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/brand/logo-stacked.svg" alt="Adam Sharp, singer and songwriter">
  <h1>Fireworks</h1>
  <p class="lede">This is a private preview. Sign in to step inside.</p>
  <form method="post" action="/api/login" autocomplete="on">
    <p class="err" id="err" role="alert" hidden></p>
    <input type="hidden" name="next" id="next" value="/">
    <label><span class="label">Username</span><input name="username" id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label><span class="label">Password</span><input name="password" id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <footer class="label">Site by CreatorLab Studios</footer>
</main>
<script src="/login.js"></script>
</body>
</html>
